[project]
name = "ckan-demo"
version = "0.1.0"
description = "Record demo videos of CKAN portals and extensions from Python scenarios."
readme = "README.md"
license = {text = "AGPL"}
requires-python = ">= 3.10"
dependencies = ["ckanapi>=4.7", "click>=8.1", "playwright>=1.40", "tomli>=1.1; python_version < '3.11'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ckan-demo = "ckan_demo.cli:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ckan_demo = ["overlay.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "PL", "TC"]
ignore = [
    "PLR0913", # recorder/CLI helpers take many options on purpose
    "RUF001",  # typographic quotes in captions are intended
    "ANN401",  # CKAN action payloads and results are JSON
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004"]
"examples/*" = ["ANN", "PLC0415"]  # in-process hooks import CKAN inside the hook

[tool.ckan-demo.brand]
logo = "examples/data/logo.svg"
background = ["#012B33", "#0BB5CC"]
text = "#ffffff"
